# Worker 1 specific patches

machine:
  # Install disk configuration
  install:
    disk: /dev/nvme0n1
    wipe: false

  # Network configuration
  network:
    hostname: talos-worker-1

  # Disable stableHostname so static hostname can be set
  features:
    stableHostname: false

  # Kubelet configuration
  kubelet:
    extraArgs:
      rotate-server-certificates: "true"
