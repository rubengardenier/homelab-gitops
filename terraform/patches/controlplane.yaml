# Control Plane specific patches
# Add your customizations here

machine:
  # Enable KubePrism for HA API access
  features:
    kubePrism:
      enabled: true
      port: 7445

  # Install disk configuration
  install:
    disk: /dev/nvme0n1
    wipe: false

  # Network configuration
  network:
    hostname: talos-cp-1

cluster:
  # Allow scheduling on control plane (optional, for small clusters)
  allowSchedulingOnControlPlanes: true

  # Proxy disabled (using Cilium or other CNI)
  # proxy:
  #   disabled: true
