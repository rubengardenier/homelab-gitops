apiVersion: apps/v1
kind: Deployment
metadata:
  name: openwebui
  namespace: openwebui
  labels:
    app: openwebui
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: openwebui
  template:
    metadata:
      labels:
        app: openwebui
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: openwebui
          image: ghcr.io/open-webui/open-webui:v0.9.5
          ports:
            - containerPort: 8080
              name: http

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL

          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "2000m"
              memory: "3Gi"

          env:
            - name: WEBUI_AUTH
              value: "true"
            - name: WEBUI_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: openwebui-secrets
                  key: secret-key
            - name: ENABLE_SIGNUP
              value: "false"
            - name: SAFE_MODE
              value: "true"
            - name: WEBUI_SESSION_COOKIE_SECURE
              value: "true"
            - name: WEBUI_SESSION_COOKIE_SAME_SITE
              value: "strict"
            # Fix for non-root user - set writable paths for NLTK and other data
            - name: HOME
              value: "/app/backend/data"
            - name: NLTK_DATA
              value: "/app/backend/data/nltk_data"
            - name: HF_HOME
              value: "/app/backend/data/huggingface"

          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 180
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

          volumeMounts:
            - name: data
              mountPath: /app/backend/data

      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: openwebui
