apiVersion: v1
kind: Service
metadata:
  name: frappe-lms-web
  namespace: frappe-lms
  labels:
    app: frappe-lms
    component: web
spec:
  type: ClusterIP
  selector:
    app: frappe-lms
    component: web
  ports:
    - protocol: TCP
      name: http
      port: 80
      targetPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: frappe-lms-redis
  namespace: frappe-lms
  labels:
    app: frappe-lms
    component: redis
spec:
  type: ClusterIP
  selector:
    app: frappe-lms
    component: redis
  ports:
    - protocol: TCP
      name: redis
      port: 6379
      targetPort: 6379
