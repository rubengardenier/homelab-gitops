apiVersion: apps/v1
kind: Deployment
metadata:
  name: frappe-lms-web
  namespace: frappe-lms
  labels: &labels
    app: frappe-lms
    component: web
spec:
  replicas: 1
  selector:
    matchLabels: *labels
  template:
    metadata:
      labels: *labels
    spec:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      initContainers:
        - name: configure
          image: ptrmtb/frappe-lms:15.41
          imagePullPolicy: IfNotPresent
          command:
            - /bin/bash
            - -c
            - |
              SITES=/home/frappe/frappe-bench/sites
              if [ ! -f "$SITES/common_site_config.json" ]; then
                echo '{
                  "db_host": "'$DB_HOST'",
                  "db_port": '$DB_PORT',
                  "redis_cache": "'$REDIS_CACHE'",
                  "redis_queue": "'$REDIS_QUEUE'",
                  "redis_socketio": "'$REDIS_SOCKETIO'",
                  "socketio_port": 9000
                }' > "$SITES/common_site_config.json"
                echo "Created common_site_config.json"
              fi
              if [ ! -f "$SITES/apps.txt" ]; then
                echo -e "frappe\nlms" > "$SITES/apps.txt"
                echo "Created apps.txt"
              fi
          envFrom:
            - configMapRef:
                name: frappe-lms-configmap
          volumeMounts:
            - name: sites
              mountPath: /home/frappe/frappe-bench/sites
      containers:
        - name: frappe-web
          image: ptrmtb/frappe-lms:15.41
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
          envFrom:
            - configMapRef:
                name: frappe-lms-configmap
            - secretRef:
                name: frappe-lms-secrets
          livenessProbe:
            httpGet:
              path: /api/method/ping
              port: 8000
              httpHeaders:
                - name: Host
                  value: frappe.homekube.dev
            initialDelaySeconds: 120
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /api/method/ping
              port: 8000
              httpHeaders:
                - name: Host
                  value: frappe.homekube.dev
            initialDelaySeconds: 60
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1.5"
              memory: "2048Mi"
          volumeMounts:
            - name: sites
              mountPath: /home/frappe/frappe-bench/sites
            - name: logs
              mountPath: /home/frappe/frappe-bench/logs
      volumes:
        - name: sites
          persistentVolumeClaim:
            claimName: frappe-lms-sites
        - name: logs
          persistentVolumeClaim:
            claimName: frappe-lms-logs
