apiVersion: batch/v1
kind: Job
metadata:
  name: frappe-lms-init
  namespace: frappe-lms
  labels:
    app: frappe-lms
    component: init
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app: frappe-lms
        component: init
    spec:
      restartPolicy: OnFailure
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: init
          image: ptrmtb/frappe-lms:15.41
          imagePullPolicy: IfNotPresent
          command:
            - /bin/bash
            - -c
            - |
              cd /home/frappe/frappe-bench

              # Ensure common_site_config.json exists
              if [ ! -f "sites/common_site_config.json" ]; then
                echo '{
                  "db_host": "'$DB_HOST'",
                  "db_port": '$DB_PORT',
                  "redis_cache": "'$REDIS_CACHE'",
                  "redis_queue": "'$REDIS_QUEUE'",
                  "redis_socketio": "'$REDIS_SOCKETIO'",
                  "socketio_port": 9000
                }' > sites/common_site_config.json
                echo "Created common_site_config.json"
              fi

              # Check if site already exists
              if [ -f "sites/frappe.homekube.dev/site_config.json" ]; then
                echo "Site already exists, running migrate..."
                bench --site frappe.homekube.dev migrate
                exit 0
              fi

              # Create site with PostgreSQL
              bench new-site frappe.homekube.dev \
                --db-host "$DB_HOST" \
                --db-port "$DB_PORT" \
                --db-name frappe \
                --db-type postgres \
                --db-root-username "$DB_ROOT_USER" \
                --db-root-password "$DB_ROOT_PASSWORD" \
                --admin-password "$ADMIN_PASSWORD" \
                --no-mariadb-socket

              # Install LMS app (already in image)
              bench --site frappe.homekube.dev install-app lms

              # Set as default site
              bench use frappe.homekube.dev

              echo "Frappe LMS initialization complete"
          envFrom:
            - configMapRef:
                name: frappe-lms-configmap
            - secretRef:
                name: frappe-lms-secrets
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2.0"
              memory: "2Gi"
          volumeMounts:
            - name: sites
              mountPath: /home/frappe/frappe-bench/sites
            - name: logs
              mountPath: /home/frappe/frappe-bench/logs
      volumes:
        - name: sites
          persistentVolumeClaim:
            claimName: frappe-lms-sites
        - name: logs
          persistentVolumeClaim:
            claimName: frappe-lms-logs
