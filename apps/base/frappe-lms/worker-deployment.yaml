apiVersion: apps/v1
kind: Deployment
metadata:
  name: frappe-lms-worker
  namespace: frappe-lms
  labels: &labels
    app: frappe-lms
    component: worker
spec:
  replicas: 1
  selector:
    matchLabels: *labels
  template:
    metadata:
      labels: *labels
    spec:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      initContainers:
        - name: configure
          image: ptrmtb/frappe-lms:15.41
          imagePullPolicy: IfNotPresent
          command:
            - /bin/bash
            - -c
            - |
              if [ ! -f /home/frappe/frappe-bench/sites/common_site_config.json ]; then
                echo '{
                  "db_host": "'$DB_HOST'",
                  "db_port": '$DB_PORT',
                  "redis_cache": "'$REDIS_CACHE'",
                  "redis_queue": "'$REDIS_QUEUE'",
                  "redis_socketio": "'$REDIS_SOCKETIO'",
                  "socketio_port": 9000
                }' > /home/frappe/frappe-bench/sites/common_site_config.json
                echo "Created common_site_config.json"
              else
                echo "common_site_config.json already exists"
              fi
          envFrom:
            - configMapRef:
                name: frappe-lms-configmap
          volumeMounts:
            - name: sites
              mountPath: /home/frappe/frappe-bench/sites
      containers:
        - name: worker
          image: ptrmtb/frappe-lms:15.41
          imagePullPolicy: IfNotPresent
          command: ["bench", "worker", "--queue", "short,default,long"]
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
          envFrom:
            - configMapRef:
                name: frappe-lms-configmap
            - secretRef:
                name: frappe-lms-secrets
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "1.0"
              memory: "1024Mi"
          volumeMounts:
            - name: sites
              mountPath: /home/frappe/frappe-bench/sites
            - name: logs
              mountPath: /home/frappe/frappe-bench/logs
        - name: scheduler
          image: ptrmtb/frappe-lms:15.41
          imagePullPolicy: IfNotPresent
          command: ["bench", "schedule"]
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
          envFrom:
            - configMapRef:
                name: frappe-lms-configmap
            - secretRef:
                name: frappe-lms-secrets
          resources:
            requests:
              cpu: "50m"
              memory: "128Mi"
            limits:
              cpu: "0.5"
              memory: "512Mi"
          volumeMounts:
            - name: sites
              mountPath: /home/frappe/frappe-bench/sites
            - name: logs
              mountPath: /home/frappe/frappe-bench/logs
      volumes:
        - name: sites
          persistentVolumeClaim:
            claimName: frappe-lms-sites
        - name: logs
          persistentVolumeClaim:
            claimName: frappe-lms-logs
