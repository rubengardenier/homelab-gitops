apiVersion: v1
kind: PersistentVolume
metadata:
  name: mealie-nfs-pv
spec:
  capacity:
    storage: 10Gi                 
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""            
  nfs:
    server: 192.168.1.100         
    path: /volume1/kubernetes/mealie