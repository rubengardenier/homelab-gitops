apiVersion: apps/v1
kind: Deployment
metadata:
  name: mealie
  namespace: mealie
  labels:
    app: mealie
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mealie
  template:
    metadata:
      labels:
        app: mealie
    spec:
      securityContext:
        fsGroup: 1000            

      containers:
        - name: mealie
          image: ghcr.io/mealie-recipes/mealie:v3.5.0
          ports:
            - containerPort: 9000
          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: TZ
              value: "Europe/Amsterdam"
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000

          volumeMounts:
            - name: data
              mountPath: /app/data   
              subPath: mealie

      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: mealie-data-pvc
