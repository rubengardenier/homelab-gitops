apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflared
  namespace: networking
spec:
  selector:
    matchLabels:
      app: cloudflared
  replicas: 2
  template:
    metadata:
      labels:
        app: cloudflared
    spec:
      dnsPolicy: ClusterFirst
      dnsConfig:
        options:
          - name: ndots
            value: "5"
      containers:
      - name: cloudflared
        image: cloudflare/cloudflared
        args:
        - tunnel
        - --config
        - /etc/cloudflared/config/config.yaml
        - run
        securityContext:
          allowPrivilegeEscalation: false
          runAsNonRoot: true
          runAsUser: 65532
          capabilities:
            drop:
              - ALL
          seccompProfile:
            type: RuntimeDefault
        volumeMounts:
        - name: config
          mountPath: /etc/cloudflared/config
          readOnly: true
        - name: creds
          mountPath: /etc/cloudflared/creds
          readOnly: true
      volumes:
      - name: creds
        secret:
          secretName: tunnel-credentials

      - name: config
        configMap:
          name: cloudflared-config
          items:
          - key: config.yaml
            path: config.yaml
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: cloudflared-config
  namespace: networking
data:
  config.yaml: |
    # Name of the tunnel you want to run
    tunnel: ldpi
    credentials-file: /etc/cloudflared/creds/credentials.json

    # Serves the metrics server under /metrics and the readiness server under /ready
    metrics: 0.0.0.0:2000
    no-autoupdate: true

    ingress:
      - hostname: linkding.homekube.dev
        service: http://linkding.linkding.svc.cluster.local:9090
      - hostname: mealie.homekube.dev
        service: http://mealie.mealie.svc.cluster.local:9000
      - hostname: n8n.homekube.dev
        service: http://n8n-service.n8n.svc.cluster.local:80
      - hostname: nzbget.homekube.dev
        service: http://nzbget.nzbget.svc.cluster.local:6789
      - hostname: openwebui.homekube.dev
        service: http://openwebui.openwebui.svc.cluster.local:8080
      - hostname: radarr.homekube.dev
        service: http://radarr.radarr.svc.cluster.local:7878
      - service: http_status:404
